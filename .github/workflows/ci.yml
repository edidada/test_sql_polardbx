name: PolarDB-X Dept Tree Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  polardbx-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Start PolarDB-X
        run: |
          docker run -d --name polardbx \
            -p 3306:3306 \
            polardbx/polardbx:latest
          echo "waiting for PolarDB-X (takes a few minutes on first boot)..."
          timeout 1200 bash -c '
            until mysql -h127.0.0.1 -P3306 -upolardbx_root -p'123456' -e "select version();" 2>/dev/null; do
              sleep 10
            done'
          mysql -h127.0.0.1 -P3306 -upolardbx_root -p'123456' -e "SELECT version();"

      - name: Run dept tree SQL demo
        run: |
          mysql -h127.0.0.1 -P3306 -upolardbx_root -p'123456' --comments < sql/dept_tree.sql
          echo "=== SQL demo executed successfully ==="

      - name: Sanity check
        run: |
          mysql -h127.0.0.1 -P3306 -upolardbx_root -p'123456' -e "
            SELECT COUNT(*) AS dept_rows FROM dept_demo.departments;
            SELECT COUNT(*) AS dept_rows_split FROM dept_demo.departments_split;"
